<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="carousel-cover">
  <div class="grid-overlay"></div>
  <div class="cover-content">
    <div class="top-bar">
      <div class="brand">TEJAS SYSTEMS</div>
      <div class="category-label">BACKEND / NETWORKING</div>
    </div>

    <div class="headline-block">
      <h1 class="headline">
        Your <span class="accent">GET /profile</span><br>
        request doesn't travel alone.
      </h1>
      <div class="tech-sub">
        <span>request lifecycle · OSI layers</span>
        <span class="thin-line"></span>
        <span>01</span>
      </div>
    </div>

    <div class="diagram">
      <div class="layer-row">
        <div class="layer-node"><div class="node-badge accent">HTTP</div><div class="node-sub">L7</div></div>
        <div class="layer-arrow"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5H20M20 5L16 2M20 5L16 8" stroke="#3F3F4A" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="layer-node"><div class="node-badge">TCP</div><div class="node-sub">L4</div></div>
        <div class="layer-arrow"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5H20M20 5L16 2M20 5L16 8" stroke="#3F3F4A" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="layer-node"><div class="node-badge">IP</div><div class="node-sub">L3</div></div>
        <div class="layer-arrow"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5H20M20 5L16 2M20 5L16 8" stroke="#3F3F4A" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="layer-node"><div class="node-badge">Ethernet</div><div class="node-sub">L2</div></div>
        <div class="layer-arrow"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5H20M20 5L16 2M20 5L16 8" stroke="#3F3F4A" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="layer-node"><div class="node-badge">Router</div><div class="node-sub">hop</div></div>
        <div class="layer-arrow"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5H20M20 5L16 2M20 5L16 8" stroke="#3F3F4A" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="layer-node"><div class="node-badge">Server</div><div class="node-sub">origin</div></div>
      </div>
      <div style="margin-top:24px;height:1px;background:linear-gradient(90deg,transparent 0%,#1e1e26 15%,#1e1e26 85%,transparent 100%);"></div>
    </div>

    <div class="bottom-bar" style="justify-content:flex-end;">
      <div class="page-indicator">01 / 07</div>
    </div>
  </div>
</div>
</body>
</html>
