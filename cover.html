<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>01 · Cover</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="_base.css">

  <style>
    /* =========================================
       HERO NETWORK DIAGRAM
       ========================================= */

    .hero-diagram {
      margin-top: 48px;
      width: 100%;
      position: relative;
    }

    .encapsulation-label {
      display: flex;
      align-items: center;
      gap: 14px;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: #6b7280;
    }

    .encapsulation-label .line {
      width: 80px;
      height: 1px;
      background: #252530;
    }

    .encapsulation-label span:last-child {
      color: #097FE8;
    }

    /* =========================================
       PACKET STACK
       ========================================= */

    .packet-stack {
      position: relative;
      height: 300px;
      margin-top: 26px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .packet-layer {
      position: absolute;

      width: 520px;
      height: 210px;

      border: 1px solid #24242d;
      border-radius: 16px;

      background: rgba(15, 15, 22, 0.92);

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      padding: 24px 28px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);
    }

    /* Outer → inner */

    .packet-layer.ethernet {
      transform: translateY(45px);
      border-color: #22232c;
    }

    .packet-layer.ip {
      transform: translateY(30px);
      width: 480px;
    }

    .packet-layer.tcp {
      transform: translateY(15px);
      width: 440px;
    }

    .packet-layer.http {
      transform: translateY(0);
      width: 400px;

      border-color: rgba(9, 127, 232, 0.7);

      background:
        linear-gradient(
          135deg,
          rgba(9, 127, 232, 0.09),
          rgba(15, 15, 22, 0.95)
        );
    }

    /* =========================================
       LAYER TEXT
       ========================================= */

    .layer-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e4e4e7;
    }

    .http .layer-name {
      color: #097FE8;
    }

    .layer-meta {
      font-family: 'JetBrains Mono', monospace;

      font-size: 11px;
      letter-spacing: 0.08em;

      color: #555560;
    }

    .request {
      display: block;

      margin-top: 14px;

      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;

      color: #ffffff;
    }

    /* =========================================
       NETWORK JOURNEY
       ========================================= */

    .journey-line {
      margin-top: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 18px;

      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .endpoint {
      color: #d4d4d8;
    }

    .network-node {
      padding: 9px 16px;

      border: 1px solid #292932;
      border-radius: 8px;

      color: #8e8e93;
      background: #0d0d13;
    }

    .journey-arrow {
      color: #3f3f4a;
      font-size: 18px;
    }

    /* =========================================
       COVER OVERRIDES
       ========================================= */

    .headline-block {
      margin-top: 40px;
    }

    .headline {
      font-size: 76px;
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #fff;
      max-width: 920px;
    }

    .headline .accent {
      color: #097FE8;
      font-weight: 700;
    }

    .bottom-bar {
      margin-top: auto;
    }
  </style>
</head>

<body>

  <div class="carousel-cover">

    <!-- Background grid -->
    <div class="grid-overlay"></div>

    <div class="cover-content">

      <!-- =====================================
           TOP BAR
           ===================================== -->

      <div class="top-bar">

        <div class="brand">
          TEJAS SYSTEMS
        </div>

        <div class="category-label">
          BACKEND / NETWORKING
        </div>

      </div>


      <!-- =====================================
           HEADLINE
           ===================================== -->

      <div class="headline-block">

        <h1 class="headline">
          Your
          <span class="accent">GET /profile</span>
          <br>
          request doesn't travel alone.
        </h1>

        <div class="tech-sub">

          <span>
            request lifecycle · OSI layers
          </span>

          <span class="thin-line"></span>

          <span>
            01
          </span>

        </div>

      </div>


      <!-- =====================================
           HERO DIAGRAM
           ===================================== -->

      <div class="hero-diagram">

        <!-- Diagram label -->

        <div class="encapsulation-label">

          <span>REQUEST</span>

          <span class="line"></span>

          <span>ENCAPSULATION</span>

        </div>


        <!-- ===================================
             ENCAPSULATION STACK
             =================================== -->

        <div class="packet-stack">

          <!-- Ethernet / outer layer -->

          <div class="packet-layer ethernet">

            <span class="layer-name">
              ETHERNET
            </span>

            <span class="layer-meta">
              FRAME · L2
            </span>

          </div>


          <!-- IP -->

          <div class="packet-layer ip">

            <span class="layer-name">
              IP
            </span>

            <span class="layer-meta">
              PACKET · L3
            </span>

          </div>


          <!-- TCP -->

          <div class="packet-layer tcp">

            <span class="layer-name">
              TCP
            </span>

            <span class="layer-meta">
              SEGMENT · L4
            </span>

          </div>


          <!-- HTTP / inner layer -->

          <div class="packet-layer http">

            <div>

              <span class="layer-name">
                HTTP
              </span>

              <span class="request">
                GET /profile
              </span>

            </div>

            <span class="layer-meta">
              DATA · L7
            </span>

          </div>

        </div>


        <!-- ===================================
             NETWORK JOURNEY
             =================================== -->

        <div class="journey-line">

          <span class="endpoint">
            YOUR APP
          </span>

          <span class="journey-arrow">
            →
          </span>

          <span class="network-node">
            NETWORK
          </span>

          <span class="journey-arrow">
            →
          </span>

          <span class="network-node">
            ROUTER
          </span>

          <span class="journey-arrow">
            →
          </span>

          <span class="endpoint">
            SERVER
          </span>

        </div>

      </div>


      <!-- =====================================
           FOOTER
           ===================================== -->

      <div class="bottom-bar">

        <div class="footer-note">
          ENCAPSULATE · ROUTE · DECAPSULATE
        </div>

        <div class="page-indicator">
          01 / 07
        </div>

      </div>

    </div>

  </div>

</body>
</html>
